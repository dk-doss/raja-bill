<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="awning" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Shop Awning Roof -->
  <path d="M96 180 L416 180 L390 120 L122 120 Z" fill="url(#awning)" opacity="0.95" />
  
  <!-- Awning Stripes -->
  <path d="M122 120 L150 180 L185 180 L160 120 Z" fill="#ea580c" opacity="0.8" />
  <path d="M220 120 L245 180 L275 180 L255 120 Z" fill="#ea580c" opacity="0.8" />
  <path d="M315 120 L340 180 L375 180 L350 120 Z" fill="#ea580c" opacity="0.8" />

  <!-- Store Front Structure -->
  <rect x="110" y="180" width="292" height="190" rx="12" fill="#ffffff" />
  
  <!-- Store Door & Windows -->
  <rect x="135" y="210" width="80" height="90" rx="8" fill="#ffedd5" />
  <rect x="297" y="210" width="80" height="90" rx="8" fill="#ffedd5" />
  <path d="M225 240 L287 240 L287 370 L225 370 Z" fill="#ea580c" />
  <circle cx="240" cy="305" r="5" fill="#ffffff" />

  <!-- Shopping Basket with Groceries in Front -->
  <g transform="translate(186, 320)">
    <path d="M20 50 L120 50 L110 110 L30 110 Z" fill="#f97316" />
    <path d="M35 50 Q70 10 105 50" stroke="#c2410c" stroke-width="8" fill="none" stroke-linecap="round" />
    <circle cx="50" cy="40" r="16" fill="#22c55e" />
    <circle cx="85" cy="36" r="14" fill="#eab308" />
    <circle cx="68" cy="28" r="15" fill="#ef4444" />
  </g>

  <!-- Letter 'R' / RAJA STORE Text Badge -->
  <text x="256" y="475" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="46" fill="#ffffff" text-anchor="middle" letter-spacing="4">RAJA STORE</text>
</svg>